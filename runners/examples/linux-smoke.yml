# Install in any private nmajorstudios repository.
name: hlkube Linux smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: hlkube-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          test "$(id -u)" = 1001
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          git --version
          python3 --version
          curl --fail --silent --output /dev/null https://api.github.com
