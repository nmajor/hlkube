# Install in nmajor/cloudlessvideo as .github/workflows/android-local.yml.
# Reusable build logic is pinned to the reviewed hlkube commit.
name: Android preview on hlkube
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    uses: nmajor/hlkube/.github/workflows/expo-android-local.yml@f08bfc4303a6cbeff27de9f57723116f7390009d
    with:
      runner: hlkube-cloudlessvideo-android
      app-directory: apps/mobile
      node-version: '24.8.0'
      package-manager: pnpm
      package-manager-version: '11.28.12'
      eas-version: '25.2.0'
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_CV_APP_KEY: ${{ secrets.EXPO_PUBLIC_CV_APP_KEY }}
