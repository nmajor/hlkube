apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: public-ca-trust
    files:
      - ca-bundle.pem
      - cacerts
generatorOptions:
  # Helm post-renderers also reference this name. Pod-template checksums in
  # public-ca-trust patches must change whenever the bundled roots change.
  disableNameSuffixHash: true
