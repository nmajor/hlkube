---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kube-prometheus-stack-grafana
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: kube-prometheus-stack-grafana
          spec:
            template:
              metadata:
                annotations:
                  security.hlkube.net/ca-bundle-sha256: f4808ea05337410284d6f1fcf7fe7cca9abb9c31312189963796955a02d02237
              spec:
                volumes:
                - name: public-ca-trust
                  configMap:
                    name: public-ca-trust
                containers:
                - name: grafana-sc-dashboard
                  env:
                  - name: SSL_CERT_FILE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: SSL_CERT_DIR
                    value: "/etc/hlkube-ca/empty"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: NODE_OPTIONS
                    value: "--use-openssl-ca"
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Djavax.net.ssl.trustStore=/etc/hlkube-ca/cacerts -Djavax.net.ssl.trustStorePassword=changeit
                      -Djavax.net.ssl.trustStoreType=JKS"
                  volumeMounts:
                  - &1
                    name: public-ca-trust
                    mountPath: "/etc/hlkube-ca"
                    readOnly: true
                - name: grafana-sc-datasources
                  env:
                  - name: SSL_CERT_FILE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: SSL_CERT_DIR
                    value: "/etc/hlkube-ca/empty"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: NODE_OPTIONS
                    value: "--use-openssl-ca"
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Djavax.net.ssl.trustStore=/etc/hlkube-ca/cacerts -Djavax.net.ssl.trustStorePassword=changeit
                      -Djavax.net.ssl.trustStoreType=JKS"
                  volumeMounts:
                  - *1
                - name: grafana
                  env:
                  - name: SSL_CERT_FILE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: SSL_CERT_DIR
                    value: "/etc/hlkube-ca/empty"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: NODE_OPTIONS
                    value: "--use-openssl-ca"
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Djavax.net.ssl.trustStore=/etc/hlkube-ca/cacerts -Djavax.net.ssl.trustStorePassword=changeit
                      -Djavax.net.ssl.trustStoreType=JKS"
                  volumeMounts:
                  - *1
            strategy:
              type: Recreate
              rollingUpdate:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kube-prometheus-stack-kube-state-metrics
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: kube-prometheus-stack-kube-state-metrics
          spec:
            template:
              metadata:
                annotations:
                  security.hlkube.net/ca-bundle-sha256: f4808ea05337410284d6f1fcf7fe7cca9abb9c31312189963796955a02d02237
              spec:
                volumes:
                - name: public-ca-trust
                  configMap:
                    name: public-ca-trust
                containers:
                - name: kube-state-metrics
                  env:
                  - name: SSL_CERT_FILE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: SSL_CERT_DIR
                    value: "/etc/hlkube-ca/empty"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: NODE_OPTIONS
                    value: "--use-openssl-ca"
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Djavax.net.ssl.trustStore=/etc/hlkube-ca/cacerts -Djavax.net.ssl.trustStorePassword=changeit
                      -Djavax.net.ssl.trustStoreType=JKS"
                  volumeMounts:
                  - name: public-ca-trust
                    mountPath: "/etc/hlkube-ca"
                    readOnly: true
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kube-prometheus-stack-operator
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: kube-prometheus-stack-operator
          spec:
            template:
              metadata:
                annotations:
                  security.hlkube.net/ca-bundle-sha256: f4808ea05337410284d6f1fcf7fe7cca9abb9c31312189963796955a02d02237
              spec:
                volumes:
                - name: public-ca-trust
                  configMap:
                    name: public-ca-trust
                containers:
                - name: kube-prometheus-stack
                  env:
                  - name: SSL_CERT_FILE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: SSL_CERT_DIR
                    value: "/etc/hlkube-ca/empty"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: NODE_OPTIONS
                    value: "--use-openssl-ca"
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Djavax.net.ssl.trustStore=/etc/hlkube-ca/cacerts -Djavax.net.ssl.trustStorePassword=changeit
                      -Djavax.net.ssl.trustStoreType=JKS"
                  volumeMounts:
                  - name: public-ca-trust
                    mountPath: "/etc/hlkube-ca"
                    readOnly: true
      - target:
          group: apps
          version: v1
          kind: DaemonSet
          name: kube-prometheus-stack-prometheus-node-exporter
        patch: |
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: kube-prometheus-stack-prometheus-node-exporter
          spec:
            template:
              metadata:
                annotations:
                  security.hlkube.net/ca-bundle-sha256: f4808ea05337410284d6f1fcf7fe7cca9abb9c31312189963796955a02d02237
              spec:
                volumes:
                - name: public-ca-trust
                  configMap:
                    name: public-ca-trust
                containers:
                - name: node-exporter
                  env:
                  - name: SSL_CERT_FILE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: SSL_CERT_DIR
                    value: "/etc/hlkube-ca/empty"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/hlkube-ca/ca-bundle.pem"
                  - name: NODE_OPTIONS
                    value: "--use-openssl-ca"
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Djavax.net.ssl.trustStore=/etc/hlkube-ca/cacerts -Djavax.net.ssl.trustStorePassword=changeit
                      -Djavax.net.ssl.trustStoreType=JKS"
                  volumeMounts:
                  - name: public-ca-trust
                    mountPath: "/etc/hlkube-ca"
                    readOnly: true
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: Prometheus
          name: kube-prometheus-stack-prometheus
        patch: |
          apiVersion: monitoring.coreos.com/v1
          kind: Prometheus
          metadata:
            name: kube-prometheus-stack-prometheus
          spec:
            volumes:
            - name: public-ca-trust
              configMap:
                name: public-ca-trust
            containers:
            - name: prometheus
              env:
              - name: SSL_CERT_FILE
                value: "/etc/hlkube-ca/ca-bundle.pem"
              - name: SSL_CERT_DIR
                value: "/etc/hlkube-ca/empty"
              - name: REQUESTS_CA_BUNDLE
                value: "/etc/hlkube-ca/ca-bundle.pem"
              - name: CURL_CA_BUNDLE
                value: "/etc/hlkube-ca/ca-bundle.pem"
              volumeMounts:
              - name: public-ca-trust
                mountPath: "/etc/hlkube-ca"
                readOnly: true
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: Alertmanager
          name: kube-prometheus-stack-alertmanager
        patch: |
          apiVersion: monitoring.coreos.com/v1
          kind: Alertmanager
          metadata:
            name: kube-prometheus-stack-alertmanager
          spec:
            volumes:
            - name: public-ca-trust
              configMap:
                name: public-ca-trust
            containers:
            - name: alertmanager
              env:
              - name: SSL_CERT_FILE
                value: "/etc/hlkube-ca/ca-bundle.pem"
              - name: SSL_CERT_DIR
                value: "/etc/hlkube-ca/empty"
              - name: REQUESTS_CA_BUNDLE
                value: "/etc/hlkube-ca/ca-bundle.pem"
              - name: CURL_CA_BUNDLE
                value: "/etc/hlkube-ca/ca-bundle.pem"
              volumeMounts:
              - name: public-ca-trust
                mountPath: "/etc/hlkube-ca"
                readOnly: true
