{
  "apiVersion": "apps/v1",
  "kind": "DaemonSet",
  "metadata": {
    "name": "host-cri-ca-probe",
    "namespace": "talos-trust-check"
  },
  "spec": {
    "selector": {
      "matchLabels": {
        "security.hlkube.net/check": "host-cri-ca-probe"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "security.hlkube.net/check": "host-cri-ca-probe"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "restartPolicy": "Always",
        "terminationGracePeriodSeconds": 1,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "emudhra-direct",
            "image": "dv-g3b-emudhra.we-have-a-problem.com/hlkube-ca-probe:never-exists-20261022",
            "imagePullPolicy": "Always",
            "command": [
              "/hlkube-ca-probe-must-never-run"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "1m",
                "memory": "8Mi"
              },
              "limits": {
                "cpu": "10m",
                "memory": "32Mi"
              }
            }
          },
          {
            "name": "emudhra-cross-sign",
            "image": "dv-g3b-aaa-emudhra.we-have-a-problem.com/hlkube-ca-probe:never-exists-20261022",
            "imagePullPolicy": "Always",
            "command": [
              "/hlkube-ca-probe-must-never-run"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "1m",
                "memory": "8Mi"
              },
              "limits": {
                "cpu": "10m",
                "memory": "32Mi"
              }
            }
          },
          {
            "name": "valid-registry-control",
            "image": "registry.k8s.io/pause:hlkube-ca-probe-never-exists-20261022",
            "imagePullPolicy": "Always",
            "command": [
              "/hlkube-ca-probe-must-never-run"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "1m",
                "memory": "8Mi"
              },
              "limits": {
                "cpu": "10m",
                "memory": "32Mi"
              }
            }
          }
        ],
        "nodeSelector": {
          "kubernetes.io/os": "linux"
        },
        "tolerations": [
          {
            "key": "node-role.kubernetes.io/control-plane",
            "operator": "Exists",
            "effect": "NoSchedule"
          }
        ]
      }
    }
  }
}
