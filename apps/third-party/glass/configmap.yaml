apiVersion: v1
kind: ConfigMap
metadata:
  name: glass-config
  namespace: glass
data:
  PUBLIC_ORIGIN: https://glass.nmajor.net
  STARPORT_ID: TOIuCX4GZ1sVXfL0j0FvzA
  # Replace account metadata before activating this app. These are not secrets.
  config.yaml: |
    tunnel: REPLACE_WITH_DEDICATED_TUNNEL_UUID
    metrics: 127.0.0.1:2000
    ingress:
      # Only this machine-registration path uses native Glass key authentication.
      - hostname: glass.nmajor.net
        path: ^/signal/host/TOIuCX4GZ1sVXfL0j0FvzA$
        service: http://127.0.0.1:8787
      # Every other request requires Cloudflare Access at both edge and connector.
      - hostname: glass.nmajor.net
        service: http://127.0.0.1:8787
        originRequest:
          access:
            required: true
            teamName: REPLACE_WITH_ACCESS_TEAM
            audTag:
              - REPLACE_WITH_ACCESS_APP_AUDIENCE
      - service: http_status:404
