apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: peek-ingress
  namespace: peek
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: peek
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 7700
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 7700
