apiVersion: apps/v1
kind: Deployment
metadata:
  name: peek
  namespace: peek
  labels:
    app.kubernetes.io/name: peek
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: peek
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peek
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: peek
          # Built by this repository's workflow from the pinned upstream commit
          # recorded in .github/workflows/build-peek-image.yml.
          image: ghcr.io/nmajor/peek:upstream-02b3a422eca5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          env:
            - name: PEEK_BASE_URL
              value: https://peek.nmajor.net
            - name: PEEK_DATA
              value: /data
            - name: PEEK_MAX_UPLOAD
              value: "10485760"
            - name: PEEK_MAX_TOTAL_SIZE
              value: "10737418240"
            - name: PEEK_TRUSTED_PROXY
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: peek-data
