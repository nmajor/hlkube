apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openseo
  namespace: openseo
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openseo.nmajor.net`)
      kind: Rule
      services:
        - name: openseo
          port: 80
      middlewares:
        - name: oauth2-auth
          namespace: traefik
        - name: header-transform
          namespace: traefik
  tls: {}
