apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openseo-ingress
  namespace: openseo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openseo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
