apiVersion: apps/v1
kind: Deployment
metadata:
  name: steel
  namespace: steel
  labels:
    app.kubernetes.io/name: steel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: steel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: steel
          image: ghcr.io/steel-dev/steel-browser:latest@sha256:b0a3253a96a11e861ccfbb61ccb6679b801b94070ddf5463c29f4df97395d85d
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            # Current self-hosted Steel releases can fail to create a browser
            # while fingerprint injection is enabled. Keep the base service
            # reliable until the upstream issue is fixed and validated here.
            - name: SKIP_FINGERPRINT_INJECTION
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: steel-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
