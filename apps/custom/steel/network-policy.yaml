apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: steel-ingress
  namespace: steel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: steel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
