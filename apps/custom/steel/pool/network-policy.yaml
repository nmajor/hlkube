# Gateway accepts traffic from Traefik; Steel pods accept traffic from the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: steel-gateway-ingress
  namespace: steel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: steel-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: steel-from-gateway
  namespace: steel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: steel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: steel-gateway
      ports:
        - protocol: TCP
          port: 3000
