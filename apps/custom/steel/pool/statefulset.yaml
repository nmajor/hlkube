# Steel pool. Each pod = one concurrent browser session. The gateway leases pods.
# Pod spec mirrors the fixed single Deployment (incl. DAC_OVERRIDE, commit 775a5ea).
# Uses :latest + imagePullPolicy: Always (cluster pulls ghcr.io/nmajor via node
# creds); pin to @sha256 later for immutable rollouts if desired.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steel
  namespace: steel
  labels:
    app.kubernetes.io/name: steel
spec:
  serviceName: steel-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: steel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: steel
          image: ghcr.io/nmajor/steel-browser:latest
          imagePullPolicy: Always
          env:
            - name: HOST
              value: 0.0.0.0
            # Stealth stays OFF for the first go-live: upstream Steel can crash on
            # browser-create with fingerprint injection enabled (the reason the
            # original deployment set this). Flip to enable stealth only after
            # validating one pod doesn't crash. Captcha solving is unaffected.
            - name: SKIP_FINGERPRINT_INJECTION
              value: "true"
            # Drives per-pod DOMAIN=steel-api.nmajor.net/s/<ordinal> in the
            # image entrypoint, so returned wss/https URLs route via the gateway.
            - name: STEEL_PUBLIC_HOST
              value: steel-api.nmajor.net
          envFrom:
            # Provides CAPSOLVER_API_KEY (seeded into the extension at start).
            - secretRef:
                name: steel-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # DAC_OVERRIDE inherited from the fixed Deployment (commit 775a5ea)
              # — lets nginx write /var/log/nginx/access.log without crash-looping.
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: longhorn-single-replica
