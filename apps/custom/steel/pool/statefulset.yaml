# Steel pool. Each pod = one concurrent browser session. The gateway leases pods.
#
# GO-LIVE TODO:
#   1. Pin `image:` to the digest of ghcr.io/nmajor/steel-browser built by CI
#      (replace :latest with @sha256:...).
#   2. Reconcile this pod spec with the other agent's crash-loop fix on
#      apps/custom/steel/deployment.yaml (securityContext/probes/args), then
#      delete deployment.yaml + steel-cache PVC (replaced by volumeClaimTemplates).
#   3. Fingerprint stealth is ON here (no SKIP_FINGERPRINT_INJECTION) — only flip
#      live once that fix confirms fingerprint injection no longer crashes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steel
  namespace: steel
  labels:
    app.kubernetes.io/name: steel
spec:
  serviceName: steel-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: steel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: steel
          # TODO(go-live): pin to @sha256 digest from CI build
          image: ghcr.io/nmajor/steel-browser:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            # Drives per-pod DOMAIN=steel-api.nmajor.net/s/<ordinal> in the
            # image entrypoint, so returned wss/https URLs route via the gateway.
            - name: STEEL_PUBLIC_HOST
              value: steel-api.nmajor.net
          envFrom:
            # Provides CAPSOLVER_API_KEY (seeded into the extension at start).
            - secretRef:
                name: steel-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: longhorn-single-replica
