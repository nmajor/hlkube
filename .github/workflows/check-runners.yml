name: Check runner configuration
on:
  pull_request:
    paths: ['runners/**', 'infrastructure/arc-scale-set-controller/**', 'components/public-ca-trust/**', 'scripts/check-runners.rb', '.github/actionlint.yaml', '.github/workflows/check-runners.yml', '.github/workflows/expo-android-local.yml']
  push:
    branches: [main]
    paths: ['runners/**', 'infrastructure/arc-scale-set-controller/**', 'components/public-ca-trust/**', 'scripts/check-runners.rb', '.github/actionlint.yaml', '.github/workflows/check-runners.yml', '.github/workflows/expo-android-local.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: fluxcd/flux2/action@f7e172882c35566ff6981d0907d2b6ad766a039f # main, 2026-11-18
        with:
          version: '2.5.1'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - run: ruby scripts/check-runners.rb
      - name: Lint runner workflows
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -config-file .github/actionlint.yaml
          .github/workflows/check-runners.yml
          .github/workflows/expo-android-local.yml
          .github/workflows/build-actions-runner-image.yml
          runners/examples/*.yml
