name: Deploy Coder Template

on:
  push:
    branches: [main]
    paths: ['apps/third-party/coder/templates/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CODER_URL: https://coder.nmajor.net
      CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
      CODER_TEMPLATE_NAME: elixirphoenixpostgres
      CODER_TEMPLATE_MESSAGE: Sync elixirphoenixpostgres from ${{ github.sha }}
      CODER_TEMPLATE_VERSION_NAME: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Coder CLI
        run: curl -L https://coder.com/install.sh | sh

      - name: Deploy Coder Template
        run: ./scripts/sync-coder-template.sh
