name: Build Actions Runner Image

on:
  push:
    branches: [main]
    paths:
      - images/actions-runner/**
      - .github/workflows/build-actions-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-actions-runner-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/actions-runner
          platforms: linux/amd64
          load: true
          tags: hlkube-actions-runner:verify
      - name: Verify runner prerequisites
        run: |
          docker run --rm hlkube-actions-runner:verify bash -euc '
            test "$(id -u)" = 1001
            /home/runner/bin/Runner.Listener --version
            for tool in git curl jq sudo docker flock gcc g++ make tar unzip zip xz rsync python3; do
              command -v "$tool"
            done
            docker buildx version
            sudo -n true
          '
      - name: Verify unprivileged runner prerequisites
        run: |
          docker run --rm --security-opt no-new-privileges --cap-drop ALL \
            hlkube-actions-runner:verify bash -euc '
              test "$(id -u)" = 1001
              /home/runner/bin/Runner.Listener --version
              python3 -m venv /tmp/probe-venv
              mkdir -p /home/runner/_work/_tool
              test -w /home/runner/_work/_tool
              git --version
              gcc --version
              unzip -v >/dev/null
            '
      - name: Publish verified image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hlkube-actions-runner"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag hlkube-actions-runner:verify "$image:$tag"
          docker push "$image:$tag"
          echo "Published $image:$tag" >> "$GITHUB_STEP_SUMMARY"
